name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    name: Test and build Android APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        working-directory: project
        run: godot --headless --import

      - name: Run unit tests
        working-directory: project
        run: godot --headless -s addons/gut/gut_cmdln.gd

      - name: Check version matches tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "version/name=\"${version%%-*}\"" project/export_presets.cfg \
            || { echo "export_presets.cfg version/name does not match tag ${GITHUB_REF_NAME}"; exit 1; }

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Export signed APK
        working-directory: project
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ../build
          godot --headless --export-release "Android" "../build/blackmarket-${GITHUB_REF_NAME}.apk"
          test -s "../build/blackmarket-${GITHUB_REF_NAME}.apk"

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for ${version}"; exit 1; }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: BLACK MARKET ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: build/blackmarket-${{ github.ref_name }}.apk
